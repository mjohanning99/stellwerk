# Stellwerk with Docker Compose (Linux only).
#
#   cp .env.example .env      # then put your own UID, GID and USER in it
#   docker compose up -d --build
#
# The container runs as you, sees your home folder at the same path and shares
# the host's network. That is what lets it start Pi and reach the Hermes
# gateway, and it also means it can do anything your user can. Read the
# "Docker" section of README.md first.
name: stellwerk

services:
  stellwerk:
    build: .
    image: stellwerk:local
    # The Hermes gateway only listens on 127.0.0.1 of the host.
    network_mode: host
    # Bash doesn't export UID and has no GID, so these come from .env.
    user: "${UID:?set UID in .env (id -u)}:${GID:?set GID in .env (id -g)}"
    environment:
      HOME: ${HOME:?HOME must be set}
      USER: ${USER:-me}
      PATH: ${HOME}/.local/bin:/usr/local/bin:/usr/bin:/bin
      STELLWERK_HOST: ${STELLWERK_HOST:-127.0.0.1}
      STELLWERK_PORT: ${STELLWERK_PORT:-7777}
      STELLWERK_ALLOWED_HOSTS: ${STELLWERK_ALLOWED_HOSTS:-}
      STELLWERK_PROXY_ORIGINS: ${STELLWERK_PROXY_ORIGINS:-.ts.net}
    volumes:
      # Your home at the same path: the agents, their sessions, your projects
      # and Stellwerk's own settings (~/.config/stellwerk) all live here.
      - ${HOME}:${HOME}
      # So your uid has a name inside the container (ssh and git want one).
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    # Reaps the Pi child processes Stellwerk starts and stops.
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
